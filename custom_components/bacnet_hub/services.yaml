reload:
  name: Reload
  description: Reload a BACnet Hub config entry.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional. If omitted and only one BACnet Hub entry exists, that entry is reloaded.
      example: 01KHE05WAZNH9B5A6PW7FPX1J0
      selector:
        text:

release:
  name: Handbedienung aufheben
  description: Gibt den gewählten Prioritäts-Slot eines kommandierbaren BACnet-Punkts frei (schreibt Null in das Priority Array).
  target:
    entity:
      integration: bacnet_hub
  fields:
    priority:
      name: Priorität
      description: BACnet-Priorität (1-16), deren Slot freigegeben wird. Standard ist 8 (Manual Operator).
      required: false
      default: 8
      example: 8
      selector:
        number:
          min: 1
          max: 16
          mode: box

set_out_of_service:
  name: Außer Betrieb setzen
  description: Setzt die Eigenschaft outOfService eines oder mehrerer BACnet-Punkte. Außer Betrieb ist der Present Value vom physischen Ein-/Ausgang entkoppelt und kann direkt geschrieben werden.
  target:
    entity:
      integration: bacnet_hub
  fields:
    out_of_service:
      name: Außer Betrieb
      description: true setzt den Punkt außer Betrieb, false nimmt ihn wieder in Betrieb.
      required: true
      example: true
      selector:
        boolean:

set_present_value:
  name: Wert schreiben
  description: Schreibt den Present Value eines oder mehrerer BACnet-Punkte. Eingänge nehmen den Wert nur an, solange sie außer Betrieb sind; kommandierbare Punkte werden mit der konfigurierten Schreibpriorität geschrieben.
  target:
    entity:
      integration: bacnet_hub
  fields:
    value:
      name: Wert
      description: Zahl für analoge Objekte, on/off bzw. true/false für binäre Objekte, Zustandsnummer oder Zustandstext für Multi-State-Objekte, Text für String-Objekte.
      required: true
      example: 21.5
      selector:
        text:

remove_missing_points:
  name: Fehlende Punkte entfernen
  description: Entfernt die Entities von Punkten, die ihr Controller nicht mehr in seiner Objektliste führt oder als unbekanntes Objekt gemeldet hat. Liefert die Anzahl und die entfernten Entity-IDs zurück.
