reload:
  name: Reload
  description: Reload a BACnet Hub config entry.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional. If omitted and only one BACnet Hub entry exists, that entry is reloaded.
      example: 01KHE05WAZNH9B5A6PW7FPX1J0
      selector:
        text:

release:
  name: Handbedienung aufheben
  description: Gibt den gewählten Prioritäts-Slot eines kommandierbaren BACnet-Punkts frei (schreibt Null in das Priority Array).
  target:
    entity:
      integration: bacnet_hub
  fields:
    priority:
      name: Priorität
      description: BACnet-Priorität (1-16), deren Slot freigegeben wird. Standard ist 8 (Manual Operator).
      required: false
      default: 8
      example: 8
      selector:
        number:
          min: 1
          max: 16
          mode: box

set_out_of_service:
  name: Außer Betrieb setzen
  description: Setzt die Eigenschaft outOfService eines oder mehrerer BACnet-Punkte. Außer Betrieb ist der Present Value vom physischen Ein-/Ausgang entkoppelt und kann direkt geschrieben werden.
  target:
    entity:
      integration: bacnet_hub
  fields:
    out_of_service:
      name: Außer Betrieb
      description: true setzt den Punkt außer Betrieb, false nimmt ihn wieder in Betrieb.
      required: true
      example: true
      selector:
        boolean:
